<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quant Problem DB Editor</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.min.js"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    displayMath:[['\\[','\\]'],['$$','$$']],
    processEscapes:true, processEnvironments:true,

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',sans-serif;background:#1a1a2e;min-height:100vh;color:#e0e0e0;}

/* Password overlay */
#pw-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;align-items:center;justify-content:center;}
.pw-box{background:#16213e;border:1px solid #0f3460;border-radius:16px;padding:48px 56px;text-align:center;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.pw-box h2{font-size:22px;margin-bottom:8px;color:#e94560;}
.pw-box p{color:#9aa0b4;margin-bottom:28px;font-size:14px;}
.pw-box input{width:100%;padding:12px 16px;border-radius:8px;border:1px solid #0f3460;background:#0f3460;color:#fff;font-size:16px;text-align:center;letter-spacing:4px;margin-bottom:16px;}
.pw-box input:focus{outline:none;border-color:#e94560;}
.pw-btn{width:100%;padding:12px;border-radius:8px;border:none;background:#e94560;color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
.pw-btn:hover{background:#c73652;}
.pw-err{color:#e94560;font-size:13px;margin-top:10px;min-height:20px;}

/* Layout */
#app{display:none;height:100vh;flex-direction:column;}
.topbar{background:#16213e;border-bottom:1px solid #0f3460;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-shrink:0;}
.topbar h1{font-size:17px;font-weight:700;color:#e94560;white-space:nowrap;}
.topbar-info{color:#9aa0b4;font-size:12px;}
.topbar-right{margin-left:auto;display:flex;gap:8px;}
.main{display:flex;flex:1;overflow:hidden;}

/* Sidebar */
.sidebar{width:255px;background:#16213e;border-right:1px solid #0f3460;display:flex;flex-direction:column;flex-shrink:0;}
.sidebar-head{padding:12px;border-bottom:1px solid #0f3460;}
.search-box{width:100%;padding:7px 11px;background:#0f3460;border:1px solid #1a4a8a;border-radius:6px;color:#e0e0e0;font-size:13px;}
.search-box:focus{outline:none;border-color:#e94560;}
.filter-row{display:flex;gap:5px;margin-top:7px;}
.filter-sel{flex:1;padding:5px 7px;background:#0f3460;border:1px solid #1a4a8a;border-radius:5px;color:#e0e0e0;font-size:11px;}
.filter-sel:focus{outline:none;}
.problem-list{flex:1;overflow-y:auto;}
.problem-item{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;transition:.12s;}
.problem-item:hover{background:rgba(233,69,96,.08);}
.problem-item.active{background:rgba(233,69,96,.18);border-left:3px solid #e94560;}
.p-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.p-meta{font-size:10px;color:#9aa0b4;margin-top:3px;display:flex;gap:5px;align-items:center;}
.badge{padding:2px 5px;border-radius:10px;font-size:9px;font-weight:700;}
.badge-easy{background:#1a4a2a;color:#4caf50;}
.badge-medium{background:#4a3a10;color:#ffc107;}
.badge-hard{background:#4a1a1a;color:#f44336;}
.badge-very_hard{background:#2a1a4a;color:#b39ddb;}
.badge-null{background:#2a2a3a;color:#666;}
.badge-in{background:#1a3a4a;color:#17a2b8;}
.badge-ex{background:#3a1a1a;color:#888;}
.sidebar-foot{padding:8px 12px;border-top:1px solid #0f3460;font-size:11px;color:#9aa0b4;}

/* Content area */
.content{flex:1;display:flex;overflow:hidden;}
.editor-panel{width:50%;overflow-y:auto;padding:16px 18px;border-right:1px solid #0f3460;}
.preview-panel{width:50%;overflow-y:auto;padding:16px 18px;background:#0d1117;}

/* Form */
.sec{font-size:11px;font-weight:700;color:#9aa0b4;text-transform:uppercase;letter-spacing:1px;margin:18px 0 8px;padding-bottom:5px;border-bottom:1px solid #0f3460;}
.sec:first-child{margin-top:0;}
.fg{margin-bottom:13px;}
.lbl{display:block;font-size:11px;font-weight:600;color:#9aa0b4;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px;}
.fc{width:100%;padding:9px 11px;background:#0f3460;border:1px solid #1a4a8a;border-radius:6px;color:#e0e0e0;font-size:13px;font-family:inherit;}
.fc:focus{outline:none;border-color:#e94560;}
textarea.fc{resize:vertical;min-height:70px;font-family:'Courier New',monospace;font-size:12px;}
select.fc{cursor:pointer;}
.cb-row{display:flex;gap:18px;flex-wrap:wrap;}
.cb{display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;}
.cb input{cursor:pointer;accent-color:#e94560;}

/* Buttons */
.btn{padding:7px 14px;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:5px;}
.btn-red{background:#e94560;color:#fff;}
.btn-red:hover{background:#c73652;}
.btn-red:disabled{background:#555;cursor:not-allowed;}
.btn-ghost{background:rgba(255,255,255,.07);color:#e0e0e0;border:1px solid rgba(255,255,255,.1);}
.btn-ghost:hover{background:rgba(255,255,255,.13);}
.btn-add{background:rgba(78,205,130,.12);color:#4ecd82;border:1px solid rgba(78,205,130,.3);}
.btn-add:hover{background:rgba(78,205,130,.2);}
.btn-add-sol{background:rgba(100,180,255,.12);color:#64b4ff;border:1px solid rgba(100,180,255,.3);}
.btn-add-sol:hover{background:rgba(100,180,255,.2);}
.btn-del{background:rgba(233,69,96,.1);color:#e94560;border:1px solid rgba(233,69,96,.3);}
.btn-del:hover{background:rgba(233,69,96,.2);}
.save-row{display:flex;gap:10px;align-items:center;margin-top:20px;padding-top:14px;border-top:1px solid #0f3460;}
.save-ok{font-size:12px;color:#4caf50;}
.save-err{font-size:12px;color:#e94560;}

/* Tags */
.tag-wrap{position:relative;}
.tag-box{background:#0f3460;border:1px solid #1a4a8a;border-radius:6px;padding:7px;min-height:38px;display:flex;flex-wrap:wrap;gap:4px;cursor:pointer;}
.tag-box:focus-within{border-color:#e94560;}
.tag{padding:2px 7px;border-radius:10px;font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:3px;}
.tq{background:#1a3a5a;color:#64b5f6;} .tf{background:#1a4a2a;color:#81c784;}
.ta{background:#3a2a5a;color:#ce93d8;} .tr{background:#4a3a1a;color:#ffd54f;}
.tl{background:#3a1a3a;color:#f48fb1;} .tc{background:#1a3a4a;color:#80deea;}
.tlo{background:#2a3a1a;color:#a5d6a7;}
.trm{cursor:pointer;opacity:.7;font-size:11px;} .trm:hover{opacity:1;}
.t-inp{background:transparent;border:none;color:#e0e0e0;font-size:11px;outline:none;min-width:60px;padding:1px 3px;}
.t-dd{position:absolute;top:100%;left:0;right:0;background:#16213e;border:1px solid #0f3460;border-radius:6px;max-height:180px;overflow-y:auto;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.5);}
.t-opt{padding:7px 11px;font-size:12px;cursor:pointer;}
.t-opt:hover{background:rgba(233,69,96,.15);}
.t-opt.sel{color:#e94560;}

/* Hints */
.hint-list{display:flex;flex-direction:column;gap:6px;}
.hint-item{display:flex;gap:6px;align-items:flex-start;}
.hint-item textarea{flex:1;min-height:50px;}
.hint-num{font-size:11px;font-weight:700;color:#9aa0b4;padding-top:10px;white-space:nowrap;min-width:24px;}

/* Solutions */
.sol-list{display:flex;flex-direction:column;gap:8px;}
.sol-item{display:flex;gap:6px;align-items:flex-start;}
.sol-item textarea{flex:1;min-height:80px;}
.sol-num{font-size:11px;font-weight:700;color:#64b4ff;padding-top:10px;white-space:nowrap;min-width:24px;}

/* Subproblems */
.sub-tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap;}
.sub-tab{padding:5px 12px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;background:#0f3460;border:1px solid #1a4a8a;color:#9aa0b4;transition:.15s;}
.sub-tab:hover{border-color:#e94560;color:#e0e0e0;}
.sub-tab.active{background:rgba(233,69,96,.2);border-color:#e94560;color:#e94560;}
.sub-tab.add-tab{background:rgba(78,205,130,.1);border-color:rgba(78,205,130,.3);color:#4ecd82;}
.sub-content{background:#0a0f1e;border:1px solid #1a4a8a;border-radius:8px;padding:14px;}
.sub-del-row{display:flex;justify-content:flex-end;margin-bottom:8px;}

/* Preview */
.prev-title{font-size:15px;font-weight:700;color:#e94560;margin-bottom:14px;}
.prev-sec{margin-bottom:16px;}
.prev-lbl{font-size:10px;font-weight:700;color:#9aa0b4;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.prev-box{background:#16213e;border:1px solid #0f3460;border-radius:7px;padding:12px;line-height:1.75;font-size:13px;}
.prev-box.sol{background:#0a1a2a;border-color:#1a3a6a;}
.prev-box.hint-box{background:#0d1a10;border-color:#1a4a2a;}
.prev-sol-num{font-size:10px;font-weight:700;color:#64b4ff;margin-bottom:4px;}
.prev-hint-num{font-size:10px;font-weight:700;color:#4ecd82;margin-bottom:4px;}
.prev-tags{display:flex;flex-wrap:wrap;gap:4px;}
.prev-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.prev-cell{background:#16213e;border:1px solid #0f3460;border-radius:6px;padding:7px 10px;}
.prev-k{font-size:9px;color:#9aa0b4;text-transform:uppercase;letter-spacing:.5px;margin-bottom:1px;}
.prev-v{font-size:12px;}

/* Sub preview tabs */
.prev-sub-tabs{display:flex;gap:3px;margin-bottom:8px;flex-wrap:wrap;}
.prev-sub-tab{padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;background:#0f3460;border:1px solid #1a4a8a;color:#9aa0b4;}
.prev-sub-tab.active{background:rgba(233,69,96,.2);border-color:#e94560;color:#e94560;}

/* Scrollbars */
::-webkit-scrollbar{width:4px;} ::-webkit-scrollbar-track{background:#0f3460;} ::-webkit-scrollbar-thumb{background:#e94560;border-radius:2px;}
.loading{display:flex;align-items:center;justify-content:center;height:180px;color:#9aa0b4;font-size:13px;}
.spinner{width:18px;height:18px;border:2px solid #0f3460;border-top-color:#e94560;border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{display:flex;align-items:center;justify-content:center;height:260px;color:#555;font-size:13px;}

/* Export / Save-All modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:8000;display:flex;align-items:center;justify-content:center;}
.modal-box{background:#16213e;border:1px solid #0f3460;border-radius:12px;padding:28px 32px;width:520px;max-width:95vw;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.modal-box h3{font-size:16px;font-weight:700;color:#e94560;margin-bottom:6px;}
.modal-box p{font-size:12px;color:#9aa0b4;margin-bottom:14px;}
.modal-box textarea{width:100%;padding:10px 12px;background:#0f3460;border:1px solid #1a4a8a;border-radius:6px;color:#e0e0e0;font-size:12px;font-family:'Courier New',monospace;resize:vertical;min-height:100px;}
.modal-box textarea:focus{outline:none;border-color:#e94560;}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;align-items:center;}
.modal-info{font-size:12px;color:#9aa0b4;margin-right:auto;}
.btn-export{background:#0f3460;color:#64b4ff;border:1px solid rgba(100,180,255,.3);}
.btn-export:hover{background:rgba(100,180,255,.15);}
.save-all-ok{color:#4caf50;font-size:12px;}
</style>
</head>
<body>

<!-- Export JSON modal -->
<div class="modal-overlay" id="export-modal" style="display:none" onclick="if(event.target===this)closeExportModal()">
  <div class="modal-box">

    <p>Enter problem IDs (one per line or comma-separated). Leave blank to export all visible / filtered problems.</p>
    <textarea id="export-ids" placeholder="e.g.&#10;quant_interview_fundamental_qdsi_p160&#10;quant_interview_fundamental_qdsi_p161&#10;sig_qdsi_p1"></textarea>
    <div class="modal-foot">
      <span class="modal-info" id="export-count"></span>
      <button class="btn btn-ghost" onclick="exportSelectAll()">Select All</button>
      <button class="btn btn-ghost" onclick="closeExportModal()">Cancel</button>
      <button class="btn btn-red" onclick="exportJSON()">Export</button>
    </div>
  </div>
</div>

<div id="pw-overlay">
  <div class="pw-box">
    <h2>🔐 Admin Access</h2>
    <p>Quant Problem Database Editor</p>
    <input type="password" id="pw-input" placeholder="Password" onkeydown="if(event.key==='Enter')tryLogin()">
    <button class="pw-btn" onclick="tryLogin()">Unlock</button>
    <div class="pw-err" id="pw-err"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <h1>⚡ Quant DB Editor</h1>
    <span class="topbar-info" id="db-info">Loading…</span>
    <div class="topbar-right">
      <button class="btn btn-ghost" onclick="loadProblems()">↺ Refresh</button>
      <button class="btn btn-add" onclick="newProblem()">＋ New Problem</button>
      <button class="btn btn-export" id="save-all-btn" onclick="saveAll()">💾 Save All</button>

          <select class="filter-sel" id="s-company" onchange="renderList()"><option value="">All companies</option></select>

    <div class="content">

      <div class="preview-panel" id="preview-panel"><div class="empty">Preview will appear here</div></div>
    </div>
  </div>
</div>

<script>
// ── Config ──
const SUPABASE_URL = 'https://qcohkjqflitxibplftcw.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFjb2hranFmbGl0eGlicGxmdGN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MzQzOTEsImV4cCI6MjA5MzAxMDM5MX0.hHtZ5PMQU-wdJtvJ4S3-xfT9XwQ1ZHuqUuiuHraKBRg';
// Password: quant2026  — change: btoa('yournewpassword')
const ADMIN_HASH = 'cXVhbnQyMDI2';

const DIFFICULTIES = ['easy','medium','hard','very_hard'];
const MATH_APPROACHES = ['algebraic','geometric','analytic','computational','probabilistic','combinatorial','symmetric','approximation','statistical','inductive','contradiction','constructive'];
const REASONING_TYPES = ['conceptual','computational','application-based','proof-based','estimation'];
const PROBLEM_LABELS = ['must-do','conceptual','frequently-tested','hard','tricky','elegant','multiple solution paths','mental math','15 seconds math','30 seconds math','45 seconds math','open-ended'];
const COMPANIES = ['Citadel','Citadel Securities','HRT','Two Sigma','Squarepoint','Point72','Cubist','SIG','Jane Street','Jump Trading','DE Shaw','Five Rings','Millennium','WorldQuant','Voleon Group','IMC Trading','Barclays'];

const FOUR_WEEK = ['Foundations of Probability Modeling','Conditional Probability','Distributions','Gaussian Distribution','Expectation & Variance','Covariance & Correlation','Miscellaneous Topics','Markov Chains','Martingales & Random Walks','Dynamic Programming','CLT & Law of Large Numbers','Hypothesis Testing','Linear Regression I','Linear Regression II','Time Series Basics','Monte Carlo Methods','Nash Equilibrium','Bayesian Games','Number Theory and Mental Math','Brain Teasers','Options Pricing and Black-Scholes'];

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let allProblems = [], currentProblem = null, currentSubKey = null, openDropdown = null;

// ── Auth ──
function tryLogin(){
  if(btoa(document.getElementById('pw-input').value)===ADMIN_HASH){
    document.getElementById('pw-overlay').style.display='none';
    document.getElementById('app').style.display='flex';
    loadProblems();
  } else {
    document.getElementById('pw-err').textContent='Incorrect password.';
    document.getElementById('pw-input').value='';
  }
}
function logout(){
  document.getElementById('pw-overlay').style.display='flex';
  document.getElementById('app').style.display='none';
  document.getElementById('pw-input').value='';
  document.getElementById('pw-err').textContent='';
}

// ── Load ──
async function loadProblems(){
  document.getElementById('db-info').textContent='Loading…';
  document.getElementById('problem-list').innerHTML='<div class="loading"><div class="spinner"></div>Loading…</div>';
  const {data,error}=await db.from('problems').select('*').order('id');
  if(error){document.getElementById('db-info').textContent='Error: '+error.message;return;}
  allProblems=data;
  document.getElementById('db-info').textContent=`${data.length} problems`;
  populateCompanyFilter();
  renderList();
}

function populateCompanyFilter(){
  const sel=document.getElementById('s-company');
  const cos=new Set();
  allProblems.forEach(p=>(p.company_labels||[]).forEach(c=>cos.add(c)));
  sel.innerHTML='<option value="">All companies</option>';
  [...cos].sort().forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o);});
}

function renderList(){
  const q=document.getElementById('s-search').value.toLowerCase();
  const co=document.getElementById('s-company').value;
  const di=document.getElementById('s-diff').value;
  const filtered=allProblems.filter(p=>{
    if(q&&!(p.problem_name||'').toLowerCase().includes(q)&&!(p.id||'').toLowerCase().includes(q)&&!(p.problem_text||'').toLowerCase().includes(q))return false;
    if(co&&!(p.company_labels||[]).includes(co))return false;
    if(di&&p.difficulty!==di)return false;
    return true;
  });
  const list=document.getElementById('problem-list');
  list.innerHTML='';
  filtered.forEach(p=>{
    const el=document.createElement('div');
    el.className='problem-item'+(currentProblem&&currentProblem.id===p.id?' active':'');
    el.dataset.id=p.id;
    el.innerHTML=`<div class="p-name">${p.problem_name||p.id}</div><div class="p-meta"><span class="badge badge-${p.difficulty||'null'}">${p.difficulty||'—'}</span><span class="badge ${p.included?'badge-in':'badge-ex'}">${p.included?'✓':'✗'}</span><span style="color:#555;font-size:10px">${(p.company_labels||[]).join(', ')}</span></div>`;
    el.onclick=()=>selectProblem(p);
    list.appendChild(el);
  });
  document.getElementById('s-count').textContent=`${filtered.length} / ${allProblems.length}`;
}

// ── Migrate hint → hints[0] on load ──
function migrateHints(p){
  // Main problem: if hint field has content and hints array is empty, move it
  if(p.hint && p.hint.trim() && (!p.hints || p.hints.length===0)){
    p.hints=[{hint_text:p.hint.trim(),hint_order:0}];
    p.hint='';
  }
  if(!p.hints) p.hints=[];
  // Subproblems
  if(p.subproblems){
    Object.values(p.subproblems).forEach(s=>{
      if(s.hint && s.hint.trim() && (!s.hints || s.hints.length===0)){
        s.hints=[{hint_text:s.hint.trim(),hint_order:0}];
        s.hint='';
      }
      if(!s.hints) s.hints=[];
    });
  }
}

// ── Migrate solution → solutions[0] on load ──
function migrateSolutions(p){
  // Main problem
  if(!p.solutions || p.solutions.length===0){
    const txt = p.solution && p.solution.text ? p.solution.text : '';
    p.solutions = txt ? [{text:txt,images:[]}] : [];
  }
  // Subproblems
  if(p.subproblems){
    Object.values(p.subproblems).forEach(s=>{
      if(!s.solutions || s.solutions.length===0){
        const txt = s.solution && s.solution.text ? s.solution.text : '';
        s.solutions = txt ? [{text:txt,images:[]}] : [];
      }
    });
  }
}

function selectProblem(p){
  currentProblem=JSON.parse(JSON.stringify(p));
  migrateHints(currentProblem);
  migrateSolutions(currentProblem);
  currentSubKey=null;
  document.querySelectorAll('.problem-item').forEach(el=>el.classList.toggle('active',el.dataset.id===p.id));
  renderEditor();
  renderPreview();
}

// ── LaTeX renderer ──
function renderLatex(text){
  if(!text) return '';
  const protEnvs=[];
  const PH='___PE_';
  function protect(t){
    const idx=protEnvs.length; protEnvs.push(t); return PH+idx+'___';
  }
  // Protect math
  text=text.replace(/\$\$[\s\S]*?\$\$/g,m=>protect(m));
  text=text.replace(/\\\[[\s\S]*?\\\]/g,m=>protect(m));
  text=text.replace(/\\\([\s\S]*?\\\)/g,m=>protect(m));
  text=text.replace(/\$([^\$\n]+?)\$/g,m=>protect(m));
  // Protect align/equation environments
  text=text.replace(/\\begin\{(align\*?|aligned|gather\*?|equation\*?|array|matrix|pmatrix|bmatrix|cases|eqnarray\*?|multline\*?|split)\}[\s\S]*?\\end\{\1\}/g,m=>protect(m));
  // Convert itemize
  text=text.replace(/\\begin\{itemize\}([\s\S]*?)\\end\{itemize\}/g,(_,c)=>{
    const items=c.split(/\\item\s*/g).filter(s=>s.trim());
    return '<ul style="margin:8px 0;padding-left:22px">'+items.map(i=>'<li>'+i.trim()+'</li>').join('')+'</ul>';
  });
  // Convert enumerate
  text=text.replace(/\\begin\{enumerate\}([\s\S]*?)\\end\{enumerate\}/g,(_,c)=>{
    const items=c.split(/\\item\s*/g).filter(s=>s.trim());
    return '<ol style="margin:8px 0;padding-left:22px">'+items.map(i=>'<li>'+i.trim()+'</li>').join('')+'</ol>';
  });
  // Text formatting
  text=text.replace(/\\textbf\{([^}]+)\}/g,'<b>$1</b>');
  text=text.replace(/\\textit\{([^}]+)\}/g,'<i>$1</i>');
  text=text.replace(/\\emph\{([^}]+)\}/g,'<em>$1</em>');
  text=text.replace(/\\underline\{([^}]+)\}/g,'<u>$1</u>');
  text=text.replace(/\\text\{([^}]+)\}/g,'$1');
  // Spacing
  text=text.replace(/\\qquad\b/g,'<span style="margin-left:2em"></span>');
  text=text.replace(/\\quad\b/g,'<span style="margin-left:1em"></span>');
  // Paragraph breaks
  text=text.replace(/\\par\b/g,'<br><br>');
  // Line breaks (not inside math)
  text=text.replace(/\\\\(?![a-zA-Z])/g,'<br>');
  // Restore
  for(let i=protEnvs.length-1;i>=0;i--) text=text.split(PH+i+'___').join(protEnvs[i]);
  return text;
}

function toggleTagDD(id,val,e){

function toggleTag(field,val){
  const arr=[...(currentProblem[field]||[])];
  const i=arr.indexOf(val);i>=0?arr.splice(i,1):arr.push(val);
  currentProblem[field]=arr;reRenderTagBox(field,null);
}

function toggleSubTag(sk,field,val){
  if(!currentProblem.subproblems)currentProblem.subproblems={};
  if(!currentProblem.subproblems[sk])currentProblem.subproblems[sk]={};
  const arr=[...(currentProblem.subproblems[sk][field]||[])];
  const i=arr.indexOf(val);i>=0?arr.splice(i,1):arr.push(val);
  currentProblem.subproblems[sk][field]=arr;
  reRenderTagBox(sk+'_'+field,sk);
}
function removeSubTag(sk,field,val){toggleSubTag(sk,field,val);}
function reRenderTagBox(id,subKey){
  const parts=id.match(/^(.+)_(quant_topics|four_week_topics|math_approach|reasoning_type|problem_labels|company_labels|location_labels)$/);
  let field=parts?parts[2]:id;

  box.innerHTML=vals.map(v=>`<span class="tag ${cls}">${v}<span class="trm" onclick="removeTag_helper('${id.replace(/'/g,"\\'")}','${v.replace(/'/g,"\\'")}')">×</span></span>`).join('')+`<input class="t-inp" id="ti-${id}" placeholder="+ add" oninput="filterDD('${id}',this.value)" onclick="event.stopPropagation();showDD('${id}')" value="${inputVal}">`;
  filterDD(id,inputVal);
}
function removeTag_helper(id,val){
  const parts=id.match(/^(.+)_(quant_topics|four_week_topics|math_approach|reasoning_type|problem_labels|company_labels|location_labels)$/);

// ── New / Exclude problem ──
function getNextQIFId(){
  const prefix='quant_interview_fundamental_qdsi_p';
  let max=0;
  allProblems.forEach(p=>{
    if(p.id&&p.id.startsWith(prefix)){
      const n=parseInt(p.id.slice(prefix.length));
      if(!isNaN(n)&&n>max)max=n;
    }
  });
  return prefix+(max+1);
}

function newProblem(){
  const newId=getNextQIFId();
  currentProblem={
    id:newId, doc_id:'', problem_name:'', problem_text:'', correct_answer:'',
    solution:{text:'',images:[]}, solutions:[], hint:'', hints:[],
    comment:'', keyword:'', difficulty:null, importance:null, version:'v1',

    subproblems:{}, topics:[], quant_topics:[], four_week_topics:[],
    math_approach:[], reasoning_type:[], problem_labels:[],
    company_labels:[], location_labels:[], images:[], updated_at:null

  currentSubKey=null;
  // Add to local list so it appears in sidebar immediately
  allProblems.push(currentProblem);
  document.getElementById('db-info').textContent=`${allProblems.length} problems`;
  renderList();
  // Scroll sidebar to the new item
  const newEl=document.querySelector(`.problem-item[data-id="${newId}"]`);
  if(newEl)newEl.scrollIntoView({block:'center'});
  renderEditor();
  renderPreview();
  document.getElementById('editor-panel').scrollTop=0;
}

async function excludeProblem(){
  const wasIncluded=currentProblem.included;
  currentProblem.included=!wasIncluded;
  const st=document.getElementById('save-st');
  const btn=document.getElementById('save-btn');
  btn.disabled=true;st.className='';st.textContent='';
  const row={...currentProblem,updated_at:new Date().toISOString().replace('T',' ').slice(0,19)};
  const {error}=await db.from('problems').upsert(row,{onConflict:'id'});
  btn.disabled=false;
  if(error){
    currentProblem.included=wasIncluded; // revert
    st.className='save-err';st.textContent='✗ '+error.message;
  } else {
    const i=allProblems.findIndex(p=>p.id===row.id);
    if(i>=0)allProblems[i]={...row};
    renderList();
    renderEditor(); // refresh button label
    st.className='save-ok';st.textContent=currentProblem.included?'✓ Re-included':'✓ Excluded';
    setTimeout(()=>st.textContent='',3000);
  }
}

async function saveProblem(){
  const btn=document.getElementById('save-btn');
  const st=document.getElementById('save-st');
  btn.disabled=true;btn.textContent='⏳ Saving…';st.className='';st.textContent='';

  // Sync solution (singular) from solutions[0] for backward compat
  const sols=currentProblem.solutions||[];
  currentProblem.solution = sols.length>0 ? {text:sols[0].text||'',images:sols[0].images||[]} : {text:'',images:[]};

  // Sync hint (singular) from hints[0] for backward compat
  const hnts=currentProblem.hints||[];
  currentProblem.hint = hnts.length>0 ? (typeof hnts[0]==='object'?hnts[0].hint_text||'':hnts[0]) : '';

  // Sync subproblem solution/hint fields
  if(currentProblem.subproblems){
    Object.keys(currentProblem.subproblems).forEach(sk=>{
      const sub=currentProblem.subproblems[sk];
      const ss=sub.solutions||[];
      sub.solution = ss.length>0 ? {text:ss[0].text||'',images:ss[0].images||[]} : {text:'',images:[]};
      const sh=sub.hints||[];
      sub.hint = sh.length>0 ? (typeof sh[0]==='object'?sh[0].hint_text||'':sh[0]) : '';
    });
  }

  const row={...currentProblem,updated_at:new Date().toISOString().replace('T',' ').slice(0,19)};
  const {error}=await db.from('problems').upsert(row,{onConflict:'id'});
  btn.disabled=false;btn.innerHTML='💾 Save to Database';
  if(error){st.className='save-err';st.textContent='✗ '+error.message;}
  else{
    st.className='save-ok';st.textContent='✓ Saved';
    const i=allProblems.findIndex(p=>p.id===row.id);
    if(i>=0)allProblems[i]={...row};
    renderList();
    setTimeout(()=>st.textContent='',3000);
  }
}

// ── Preview ──
let prevTimer=null;
function dPrev(){clearTimeout(prevTimer);prevTimer=setTimeout(renderPreview,500);}

let prevSubKey=null;
function renderPreview(){
  const p=currentProblem;
  const subKeys=getSubKeys();
  const panel=document.getElementById('preview-panel');
  const sols=p.solutions||[];
  const hnts=p.hints||[];

  panel.innerHTML=`
  <div class="prev-title">${escH(p.problem_name||p.id)}</div>

  <div class="prev-sec">
    <div class="prev-lbl">Problem</div>
    <div class="prev-box">${renderLatex(p.problem_text)||'<span style="color:#555">No text</span>'}</div>
  </div>
  ${p.correct_answer?`<div class="prev-sec"><div class="prev-lbl">Answer</div><div class="prev-box">${renderLatex(p.correct_answer)}</div></div>`:''}

  ${sols.length?`<div class="prev-sec">
    <div class="prev-lbl">Solution${sols.length>1?'s':''}</div>
    ${sols.map((s,i)=>`
      ${sols.length>1?`<div class="prev-sol-num">S${i+1}</div>`:''}
      <div class="prev-box sol" style="margin-bottom:${i<sols.length-1?'8px':'0'}">${renderLatex(typeof s==='object'?s.text||'':s)||'<span style="color:#555">—</span>'}</div>
    `).join('')}
  </div>`:''}

  ${hnts.length?`<div class="prev-sec">
    <div class="prev-lbl">Hint${hnts.length>1?'s':''}</div>
    ${hnts.map((h,i)=>`
      ${hnts.length>1?`<div class="prev-hint-num">H${i+1}</div>`:''}
      <div class="prev-box hint-box" style="margin-bottom:${i<hnts.length-1?'4px':'0'}">${renderLatex(typeof h==='object'?h.hint_text||'':h)}</div>
    `).join('')}
  </div>`:''}

  <div class="prev-sec">
    <div class="prev-lbl">Metadata</div>
    <div class="prev-grid">
      <div class="prev-cell"><div class="prev-k">Difficulty</div><div class="prev-v">${p.difficulty||'—'}</div></div>
      <div class="prev-cell"><div class="prev-k">Importance</div><div class="prev-v">${p.importance||'—'}</div></div>
      <div class="prev-cell"><div class="prev-k">Version</div><div class="prev-v">${p.version||'—'}</div></div>
      <div class="prev-cell"><div class="prev-k">Included</div><div class="prev-v">${p.included?'✓ Yes':'✗ No'}</div></div>
      <div class="prev-cell"><div class="prev-k">Free / Recent</div><div class="prev-v">${p.is_free?'Free':'Paid'} · ${p.is_recent?'Recent':'—'}</div></div>
      <div class="prev-cell"><div class="prev-k">Solutions / Hints</div><div class="prev-v">${sols.length} sol · ${hnts.length} hint</div></div>
    </div>
  </div>

  ${tagPrev('Quant Topics',p.quant_topics,'tq')}
  ${tagPrev('Four-Week',p.four_week_topics,'tf')}
  ${tagPrev('Approach',p.math_approach,'ta')}
  ${tagPrev('Reasoning',p.reasoning_type,'tr')}
  ${tagPrev('Labels',p.problem_labels,'tl')}
  ${tagPrev('Companies',p.company_labels,'tc')}
  ${tagPrev('Locations',p.location_labels,'tlo')}

  ${subKeys.length?`
  <div class="prev-sec">
    <div class="prev-lbl">Subproblems</div>
    <div class="prev-sub-tabs">${subKeys.map(k=>`<div class="prev-sub-tab${prevSubKey===k?' active':''}" onclick="setPrevSub('${k}')">${k.toUpperCase()}</div>`).join('')}</div>
    <div id="sub-prev">${renderSubPreview(prevSubKey&&currentProblem.subproblems[prevSubKey]?prevSubKey:subKeys[0])}</div>
  </div>`:''}

  ${p.comment?`<div class="prev-sec"><div class="prev-lbl">Comment</div><div class="prev-box" style="color:#aaa;font-size:12px">${renderLatex(p.comment)}</div></div>`:''}
  `;
  if(!prevSubKey&&subKeys.length)prevSubKey=subKeys[0];
  if(window.MathJax&&window.MathJax.typesetPromise) window.MathJax.typesetPromise([panel]).catch(()=>{});
}

function renderSubPreview(sk){
  const s=(currentProblem.subproblems||{})[sk]||{};
  const ssols=s.solutions||[];
  const shnts=s.hints||[];
  return `<div class="sub-content">
    ${s.problem_text?`<div class="prev-sec"><div class="prev-lbl">${sk.toUpperCase()}: Problem</div><div class="prev-box">${renderLatex(s.problem_text)}</div></div>`:''}
    ${s.correct_answer?`<div class="prev-sec"><div class="prev-lbl">Answer</div><div class="prev-box">${renderLatex(s.correct_answer)}</div></div>`:''}
    ${ssols.length?`<div class="prev-sec">
      <div class="prev-lbl">Solution${ssols.length>1?'s':''}</div>
      ${ssols.map((sv,i)=>`${ssols.length>1?`<div class="prev-sol-num">S${i+1}</div>`:''}
        <div class="prev-box sol" style="margin-bottom:${i<ssols.length-1?'6px':'0'}">${renderLatex(typeof sv==='object'?sv.text||'':sv)||'<span style="color:#555">—</span>'}</div>`).join('')}
    </div>`:''}
    ${shnts.length?`<div class="prev-sec">
      <div class="prev-lbl">Hint${shnts.length>1?'s':''}</div>
      ${shnts.map((h,i)=>`${shnts.length>1?`<div class="prev-hint-num">H${i+1}</div>`:''}
        <div class="prev-box hint-box" style="margin-bottom:${i<shnts.length-1?'4px':'0'}">${renderLatex(typeof h==='object'?h.hint_text||'':h)}</div>`).join('')}
    </div>`:''}
    ${s.comment?`<div class="prev-sec"><div class="prev-lbl">Comment</div><div class="prev-box" style="color:#aaa;font-size:12px">${renderLatex(s.comment)}</div></div>`:''}
  </div>`;
}

function setPrevSub(sk){
  prevSubKey=sk;
  document.querySelectorAll('.prev-sub-tab').forEach(el=>el.classList.toggle('active',el.textContent.trim().toLowerCase()===sk));
  const el=document.getElementById('sub-prev');
  if(el){el.innerHTML=renderSubPreview(sk);if(window.MathJax&&window.MathJax.typesetPromise)window.MathJax.typesetPromise([el]).catch(()=>{});}
}

function tagPrev(label,arr,cls){if(!arr||!arr.length)return '';return `<div class="prev-sec"><div class="prev-lbl">${label}</div><div class="prev-tags">${arr.map(v=>`<span class="tag ${cls}">${v}</span>`).join('')}</div></div>`;}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── Save All ──
function buildSaveRow(p){
  const clone=JSON.parse(JSON.stringify(p));
  const sols=clone.solutions||[];
  clone.solution=sols.length>0?{text:sols[0].text||'',images:sols[0].images||[]}:{text:'',images:[]};
  const hnts=clone.hints||[];
  clone.hint=hnts.length>0?(typeof hnts[0]==='object'?hnts[0].hint_text||'':hnts[0]):'';
  if(clone.subproblems){
    Object.keys(clone.subproblems).forEach(sk=>{
      const sub=clone.subproblems[sk];
      const ss=sub.solutions||[];
      sub.solution=ss.length>0?{text:ss[0].text||'',images:ss[0].images||[]}:{text:'',images:[]};
      const sh=sub.hints||[];
      sub.hint=sh.length>0?(typeof sh[0]==='object'?sh[0].hint_text||'':sh[0]):'';
    });
  }
  clone.updated_at=new Date().toISOString().replace('T',' ').slice(0,19);
  return clone;
}

async function saveAll(){
  const btn=document.getElementById('save-all-btn');
  btn.disabled=true;

  // Sync any unsaved edits from currentProblem back into allProblems
  if(currentProblem){
    const sols=currentProblem.solutions||[];
    currentProblem.solution=sols.length>0?{text:sols[0].text||'',images:sols[0].images||[]}:{text:'',images:[]};
    const hnts=currentProblem.hints||[];
    currentProblem.hint=hnts.length>0?(typeof hnts[0]==='object'?hnts[0].hint_text||'':hnts[0]):'';
    if(currentProblem.subproblems){
      Object.keys(currentProblem.subproblems).forEach(sk=>{
        const sub=currentProblem.subproblems[sk];
        const ss=sub.solutions||[];
        sub.solution=ss.length>0?{text:ss[0].text||'',images:ss[0].images||[]}:{text:'',images:[]};
        const sh=sub.hints||[];
        sub.hint=sh.length>0?(typeof sh[0]==='object'?sh[0].hint_text||'':sh[0]):'';
      });
    }
    const idx=allProblems.findIndex(p=>p.id===currentProblem.id);
    if(idx>=0) allProblems[idx]=JSON.parse(JSON.stringify(currentProblem));
    else allProblems.push(JSON.parse(JSON.stringify(currentProblem)));
  }

  const rows=allProblems.map(buildSaveRow);
  const BATCH=50;
  let done=0,errMsgs=[];
  for(let i=0;i<rows.length;i+=BATCH){
    btn.textContent=`⏳ ${done}/${rows.length}`;
    const {error}=await db.from('problems').upsert(rows.slice(i,i+BATCH),{onConflict:'id'});
    if(error) errMsgs.push(`Batch ${Math.floor(i/BATCH)+1}: ${error.message}`);
    done=Math.min(done+BATCH,rows.length);
  }
  btn.disabled=false;
  if(errMsgs.length){
    btn.textContent='⚠ Errors';
    alert('Save All errors:\n'+errMsgs.join('\n'));
    setTimeout(()=>{btn.textContent='💾 Save All';},4000);
  } else {
    btn.textContent=`✓ Saved ${rows.length}`;
    renderList();
    setTimeout(()=>{btn.textContent='💾 Save All';},3000);
  }
}

// ── Export JSON ──
function openExportModal(){
  document.getElementById('export-modal').style.display='flex';
  updateExportCount();
}
function closeExportModal(){document.getElementById('export-modal').style.display='none';}

function exportSelectAll(){
  document.getElementById('export-ids').value=allProblems.map(p=>p.id).join('\n');
  updateExportCount();
}

function updateExportCount(){
  const raw=document.getElementById('export-ids').value;
  const ids=raw.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean);
  const count=ids.length?allProblems.filter(p=>ids.includes(p.id)).length:allProblems.length;
  document.getElementById('export-count').textContent=`${count} problem${count!==1?'s':''}`;
}

document.addEventListener('DOMContentLoaded',()=>{
  const ta=document.getElementById('export-ids');
  if(ta)ta.addEventListener('input',updateExportCount);
});

function solsToText(solutions, fallbackSolution){
  const arr = solutions || [];
  const texts = arr.map(s => typeof s === 'object' ? s.text || '' : s).filter(t => t);
  if(texts.length === 0){
    const fb = fallbackSolution && fallbackSolution.text ? fallbackSolution.text : null;
    return {text: fb, images: (fallbackSolution && fallbackSolution.images) || []};
  }
  return {
    text: texts.length === 1 ? texts[0] : texts,
    images: (fallbackSolution && fallbackSolution.images) || []
  };
}

function toV32Problem(p){
  // Transform subproblems: remove solutions[] array, convert to solution.text (string or list)
  const subs = {};
  Object.entries(p.subproblems || {}).forEach(([k, s]) => {
    subs[k] = {
      problem_text:   s.problem_text || null,
      correct_answer: s.correct_answer || null,
      hints:          s.hints || [],
      hint:           s.hint || null,
      solution:       solsToText(s.solutions, s.solution),
      images:         s.images || [],
      comment:        s.comment || null
    };
  });

  // Build in v32 key order, omitting the DB-only 'solutions' plural field
  return {
    id:               p.id,
    doc_id:           p.doc_id,
    problem_name:     p.problem_name,
    problem_text:     p.problem_text,
    subproblems:      subs,
    correct_answer:   p.correct_answer,
    hint:             p.hint || null,
    hints:            p.hints || [],
    solution:         solsToText(p.solutions, p.solution),
    images:           p.images || [],
    difficulty:       p.difficulty,
    topics:           p.topics || [],
    quant_topics:     p.quant_topics || [],
    four_week_topics: p.four_week_topics || [],
    math_approach:    p.math_approach || [],
    reasoning_type:   p.reasoning_type || [],
    problem_labels:   p.problem_labels || [],
    comment:          p.comment || null,
    importance:       p.importance,
    keyword:          p.keyword || null,
    company_labels:   p.company_labels || [],
    location_labels:  p.location_labels || [],
    is_free:          p.is_free || false,
    is_recent:        p.is_recent || false,
    updated_at:       p.updated_at,
    version:          p.version,
    included:         p.included !== false
  };
}

function exportJSON(){
  const raw=document.getElementById('export-ids').value;
  const ids=raw.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean);
  const selected=ids.length?allProblems.filter(p=>ids.includes(p.id)):allProblems;
  if(!selected.length){alert('No matching problems found.');return;}

  // Build document block from first problem's doc_id
  const firstDocId = selected[0].doc_id || 'export';
  const document_meta = {
    id:             firstDocId,
    school:         firstDocId.split('_qdsi')[0].replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()),
    course:         null,
    problem_type:   'qdsi',
    term:           null,
    year:           null,
    total_problems: selected.length,
    created_at:     new Date().toISOString()
  };

  const payload = {
    document: document_meta,
    problems: selected.map(p => toV32Problem(JSON.parse(JSON.stringify(p))))
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`quant_export_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  closeExportModal();
}
</script>
